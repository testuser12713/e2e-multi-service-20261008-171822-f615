[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Job processing API and worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
