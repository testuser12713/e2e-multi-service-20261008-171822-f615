<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auftragsverarbeitung — Aktualisieren</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header" data-od-id="app-header">
    <div class="container header-inner">
      <div class="brand" data-od-id="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Auftragsverarbeitung</span>
      </div>
      <div class="header-right">
        <span class="refresh-status js-refresh-status" data-od-id="refresh-status"><span class="spinner" aria-hidden="true"></span>Aktualisiere…</span>
        <span class="health-chip js-health-chip" data-od-id="health-chip"><span class="health-dot is-ok"></span>API ok</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="layout">
      <form class="form-panel js-job-form" data-submit-mode="add" data-od-id="form-panel">
        <div>
          <label class="form-label" for="job-text">Text</label>
          <textarea id="job-text" class="textarea js-job-text" data-od-id="job-text-input" placeholder="Text einfügen oder eingeben…"></textarea>
          <div class="form-meta">
            <span class="field-error">Der Text darf nicht leer sein.</span>
            <span class="char-counter js-char-counter">0 Zeichen</span>
          </div>
        </div>
        <div>
          <label class="form-label" for="analysis">Analyse</label>
          <select id="analysis" class="select js-analysis" data-od-id="analysis-select">
            <option value="word_count" selected>word_count — Wörter zählen</option>
            <option value="top_words">top_words — häufigste Wörter</option>
            <option value="reading_time">reading_time — geschätzte Lesezeit</option>
          </select>
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary js-submit" data-od-id="submit-job" disabled aria-disabled="true">
            <span class="js-submit-label">Auftrag anlegen (Text erforderlich)</span>
          </button>
          <span class="form-hint">Aufträge laufen im Hintergrund — Ergebnisse erscheinen innerhalb weniger Sekunden.</span>
        </div>
      </form>

      <section class="list-col" data-od-id="job-list">
        <div class="job-list js-job-list">
          <article class="skeleton-card" data-od-id="skeleton-card-1">
            <div class="job-top">
              <span class="sk sk-badge"></span>
              <span class="sk sk-meta"></span>
            </div>
            <div class="sk sk-line"></div>
            <div class="sk sk-line w-70"></div>
            <div class="sk sk-result"></div>
          </article>
          <article class="skeleton-card" data-od-id="skeleton-card-2">
            <div class="job-top">
              <span class="sk sk-badge"></span>
              <span class="sk sk-meta"></span>
            </div>
            <div class="sk sk-line"></div>
            <div class="sk sk-line w-40"></div>
            <div class="sk sk-result"></div>
          </article>
          <article class="skeleton-card" data-od-id="skeleton-card-3">
            <div class="job-top">
              <span class="sk sk-badge"></span>
              <span class="sk sk-meta"></span>
            </div>
            <div class="sk sk-line"></div>
            <div class="sk sk-line w-70"></div>
            <div class="sk sk-result"></div>
          </article>
        </div>
      </section>
    </div>
  </main>

  <nav class="container mockup-nav" aria-label="Mockup-Bildschirme">
    <span class="mockup-label">Mockup · Bildschirme:</span>
    <a href="index.html">Aufträge</a>
    <a href="empty.html">Leer</a>
    <a href="validation.html">Validierung</a>
    <a href="api-unreachable.html">API nicht erreichbar</a>
    <a href="skeleton.html" class="is-current">Aktualisieren</a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
